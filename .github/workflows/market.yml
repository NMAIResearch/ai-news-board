name: Refresh market data

# Writes data/market.json only. It does NOT run the feed pipeline and does NOT rebuild
# index.html: the review pass on incoming items is a human call, and a workflow that
# rebuilt the board would publish unreviewed items on a timer.
#
# ⚠️ GitHub's scheduled runs are best-effort and routinely fire 5-20 minutes late, so this
# is a periodic refresh, not a live tick. The page fetches data/market.json client-side and
# re-fetches every 60s, which is what makes an open tab look live.
#
# ⚠️ GitHub disables scheduled workflows on public repos after 60 days with no commits.
# This workflow's own commits reset that clock while it is running.

on:
  schedule:
    # Weekdays. 14:00 UTC is shortly after the US open; 21:30 UTC is after the close.
    - cron: "0 14 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No pip install: the whole pipeline is stdlib, and the runner ships Python 3.
      - name: Fetch quotes
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional fallback. If this secret is absent the run still succeeds, it just
          # loses the second provider; a missing nice-to-have must not fail the fetch.
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python3 fetch_market.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/market_history.json
          # Only the generated timestamp changing is not worth a commit.
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Market data refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
